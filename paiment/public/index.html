<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paiement en ligne</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Paiement en ligne</h1>
        <p class="subtitle">Renseignez les informations de paiement.</p>

        <form id="paymentForm" autocomplete="on">
          <div class="field">
            <label for="labName">Nom du labo</label>
            <input id="labName" name="labName" type="text" required />
          </div>

          <div class="field">
            <label for="responsable">Responsable</label>
            <input id="responsable" name="responsable" type="text" required />
          </div>

          <div class="field">
            <label for="phone">Numero de telephone</label>
            <input id="phone" name="phone" type="tel" placeholder="+216 xx xxx xxx" required />
          </div>

          <div class="field">
            <label for="montantTotal">Montant total (TND)</label>
            <input id="montantTotal" name="montantTotal" type="number" min="0" step="0.01" required />
          </div>

          <div class="field">
            <label for="montantPaye">Montant paye (TND)</label>
            <input id="montantPaye" name="montantPaye" type="number" min="0" step="0.01" required />
          </div>

          <div class="field">
            <label for="reste">Reste a payer (TND)</label>
            <input id="reste" name="reste" type="number" step="0.01" readonly />
          </div>

          <div class="field">
            <label for="cardNumber">Numero de carte bancaire</label>
            <input
              id="cardNumber"
              name="cardNumber"
              type="text"
              inputmode="numeric"
              maxlength="19"
              placeholder="1234 5678 9012 3456"
              required
            />
          </div>

          <div class="field">
            <label for="expiry">Expiration (MM/AA)</label>
            <input id="expiry" name="expiry" type="text" placeholder="08/29" maxlength="5" required />
          </div>

          <button type="submit">Valider le paiement</button>
        </form>

        <p id="result" class="result" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
